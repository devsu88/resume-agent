[project]
name = "resume-agent"
version = "0.1.0"
description = "A website assistant that answers questions about a CV and scores how well it matches a job offer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6",
    "httpx>=0.27",
    "langgraph>=0.2",
    "openai>=1.40",
    "pypdf>=4",
    "python-dotenv>=1.0",
]

[project.scripts]
resume-agent = "resume_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/resume_agent/matching/prompts.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
